# scRNA-seq + VDJ analysis pipeline environment
#
# Prerequisites (installed separately):
#   - Cell Ranger (10x Genomics, proprietary): https://support.10xgenomics.com/
#   - NVIDIA GPU drivers + CUDA toolkit for GPU acceleration
#
# Create with:  mamba env create -f environment.yml
# Update with:  mamba env update -f environment.yml --prune

name: scrna_pipeline
channels:
  - pytorch
  - conda-forge
  - bioconda
dependencies:
  - python=3.11

  # GPU / deep-learning
  - pytorch>=2.0
  - pytorch-cuda=12.4

  # Core single-cell
  - scanpy>=1.10
  - anndata>=0.10
  - scvi-tools>=1.1
  - scirpy>=0.18
  - celltypist>=1.6
  - leidenalg>=0.10

  # QC & integration
  - scrublet>=0.2.3
  - harmonypy>=0.0.9
  - scib>=1.1

  # Differential expression & pathway analysis
  - pydeseq2>=0.4
  - decoupler>=1.6

  # Scientific stack
  - numpy>=1.26
  - pandas>=2.1
  - scipy>=1.12
  - scikit-learn>=1.3

  # Plotting
  - matplotlib>=3.8
  - seaborn>=0.13

  # Utilities
  - pyyaml>=6.0

  # Pip-only packages
  - pip:
    - cellbender>=0.3
